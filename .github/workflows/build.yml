name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # src/Santase.sln also contains UI/Santase.UI, the MAUI app: it needs the
      # MAUI workloads and targets net10.0-ios/maccatalyst, which cannot build on
      # a Windows runner. So the projects are built individually instead of the
      # solution. These five cover everything else through their references:
      # Santase.Logic, DummyPlayer, SmartPlayer and ClaudePlayer.
      - name: Build
        run: |
          dotnet build src/Tests/Santase.Logic.Tests/Santase.Logic.Tests.csproj -c Release
          dotnet build src/Tests/Santase.AI.SmartPlayer.Tests/Santase.AI.SmartPlayer.Tests.csproj -c Release
          dotnet build src/Tests/Santase.AI.ClaudePlayer.Tests/Santase.AI.ClaudePlayer.Tests.csproj -c Release
          dotnet build src/Tests/Santase.Tests.GameSimulations/Santase.Tests.GameSimulations.csproj -c Release
          dotnet build src/UI/Santase.UI.Console/Santase.UI.Console.csproj -c Release

      - name: Test
        run: |
          dotnet test src/Tests/Santase.Logic.Tests/Santase.Logic.Tests.csproj -c Release --no-build --logger "trx;LogFileName=logic.trx"
          dotnet test src/Tests/Santase.AI.SmartPlayer.Tests/Santase.AI.SmartPlayer.Tests.csproj -c Release --no-build --logger "trx;LogFileName=smartplayer.trx"
          dotnet test src/Tests/Santase.AI.ClaudePlayer.Tests/Santase.AI.ClaudePlayer.Tests.csproj -c Release --no-build --logger "trx;LogFileName=claudeplayer.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: src/Santase.Logic/bin/Release/*.nupkg
          if-no-files-found: error
