name: Publish

# Publishes the engine, SantaseGameEngine, to nuget.org. Publishing is irreversible: a version that
# has been pushed can never be replaced, only unlisted. So this runs only for a published GitHub
# release whose tag is the engine's version (for example 3.0.0, matching <Version> in
# src/Santase.Logic/Santase.Logic.csproj), or a deliberate manual dispatch for such a tag, and it
# refuses to push a package whose tests do not pass. nuget.org Trusted Publishing exchanges the
# workflow's OIDC token for a short-lived API key, so no NuGet API key is stored in the repository.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (the engine version, for example 3.0.0)
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: Test, pack and publish to NuGet
    runs-on: windows-latest

    # Gives you somewhere to require a manual approval before the push. The nuget.org Trusted
    # Publishing policy is restricted to this environment, so keep them in sync.
    environment: release

    permissions:
      # Required for Trusted Publishing: without it GitHub will not issue the OIDC token.
      id-token: write
      # Attaches the package to the GitHub release.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check that the package version matches the tag
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/Santase.Logic/Santase.Logic.csproj -XPath '//Version').Node.InnerText
          if ($version -ne $env:TAG) {
            throw "Santase.Logic.csproj has version $version but the release tag is $env:TAG."
          }

      # The same projects as the build workflow: the MAUI app cannot build here, and these cover the
      # engine and every bot through their references. ContinuousIntegrationBuild makes the package
      # deterministic, with source paths Source Link can map back to this commit.
      - name: Build
        run: |
          dotnet build src/Tests/Santase.Logic.Tests/Santase.Logic.Tests.csproj -c Release -p:ContinuousIntegrationBuild=true
          dotnet build src/Tests/Santase.AI.SmartPlayer.Tests/Santase.AI.SmartPlayer.Tests.csproj -c Release -p:ContinuousIntegrationBuild=true
          dotnet build src/Tests/Santase.AI.ClaudePlayer.Tests/Santase.AI.ClaudePlayer.Tests.csproj -c Release -p:ContinuousIntegrationBuild=true
          dotnet build src/Tests/Santase.UI.Tests/Santase.UI.Tests.csproj -c Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: |
          dotnet test src/Tests/Santase.Logic.Tests/Santase.Logic.Tests.csproj -c Release --no-build
          dotnet test src/Tests/Santase.AI.SmartPlayer.Tests/Santase.AI.SmartPlayer.Tests.csproj -c Release --no-build
          dotnet test src/Tests/Santase.AI.ClaudePlayer.Tests/Santase.AI.ClaudePlayer.Tests.csproj -c Release --no-build
          dotnet test src/Tests/Santase.UI.Tests/Santase.UI.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Santase.Logic/Santase.Logic.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true -o artifacts

      # The temporary key nuget.org issues is valid for one hour, so it is requested immediately
      # before the push rather than at the start of the job.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg beside the package is pushed with it, to the symbol server.
      - name: Push to nuget.org
        run: >
          dotnet nuget push artifacts/SantaseGameEngine.${{ env.TAG }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ env.TAG }} artifacts/SantaseGameEngine.${{ env.TAG }}.nupkg artifacts/SantaseGameEngine.${{ env.TAG }}.snupkg --clobber
